<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Ahorro Solar - Ley 1715</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-10 flex justify-center items-center min-h-screen">
    <div class="max-w-md w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl space-y-6">
        <div class="text-center">
            <span class="bg-amber-500/10 text-amber-400 text-xs font-semibold px-3 py-1 rounded-full border border-amber-500/20">Modelo CAPEX Cero</span>
            <h1 class="text-2xl font-bold text-white mt-2">Calculadora Solar</h1>
        </div>

        <form id="formSolar" class="space-y-4">
            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">Empresa</label>
                <input type="text" id="empresa" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-white focus:border-amber-500 outline-none" placeholder="Ej. Industrias S.A.S.">
            </div>
            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">Correo Corporativo</label>
                <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-white focus:border-amber-500 outline-none" placeholder="contacto@empresa.com">
            </div>
            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">Pago Mensual de Energía (COP)</label>
                <input type="number" id="pago" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-white focus:border-amber-500 outline-none" placeholder="Ej. 15000000">
            </div>
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold p-3 rounded-lg transition-all">Calcular Ahorro</button>
        </form>

        <div id="resultado" class="hidden p-4 bg-slate-900 rounded-lg border border-slate-700 text-center space-y-2">
            <h3 class="text-sm font-semibold text-amber-400">Diagnóstico Estimado</h3>
            <p id="txtAhorro" class="text-lg font-extrabold text-emerald-400"></p>
        </div>
    </div>

    <script>
        document.getElementById('formSolar').onsubmit = async (e) => {
            e.preventDefault();
            const pago = parseFloat(document.getElementById('pago').value);
            const ahorro = pago * 0.40;

            document.getElementById('txtAhorro').innerText = 'Ahorro estimado: $' + ahorro.toLocaleString('es-CO') + ' COP/mes';
            document.getElementById('resultado').classList.remove('hidden');

            try {
                await fetch('/api/v1/leads', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        empresa: document.getElementById('empresa').value,
                        contacto_email: document.getElementById('email').value,
                        pago_mensual_cop: pago
                    })
                });
                console.log('Lead enviado exitosamente al backend.');
            } catch (err) {
                console.error('Error al enviar lead:', err);
            }
        };
    </script>
</body>
</html>
