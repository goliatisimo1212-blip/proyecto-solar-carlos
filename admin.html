<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - Leads Solares</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        <div class="flex justify-between items-center bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
            <div>
                <span class="bg-amber-500/10 text-amber-400 text-xs font-semibold px-3 py-1 rounded-full border border-amber-500/20">Panel v5.5.0</span>
                <h1 class="text-2xl font-bold text-white mt-1">Empresas Captadas (Ley 1715)</h1>
            </div>
            <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm transition-colors border border-slate-700">
                Ir a la Calculadora
            </a>
        </div>

        <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-white">Lista de Leads Registrados</h2>
                <button onclick="cargarLeads()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors">
                    🔄 Actualizar Tabla
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-800/50 text-slate-400 uppercase text-xs">
                        <tr>
                            <th class="px-6 py-4">ID</th>
                            <th class="px-6 py-4">Cliente / Empresa</th>
                            <th class="px-6 py-4">Contacto</th>
                            <th class="px-6 py-4">Factura Mensual</th>
                            <th class="px-6 py-4">kW Est.</th>
                            <th class="px-6 py-4">Ahorro Anual</th>
                            <th class="px-6 py-4">Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-leads" class="divide-y divide-slate-800">
                        <tr>
                            <td colspan="7" class="px-6 py-8 text-center text-slate-500">Cargando registros...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function cargarLeads() {
            const tbody = document.getElementById('tabla-leads');
            try {
                const response = await fetch('/api/leads');
                const data = await response.json();

                if (!data || data.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7" class="px-6 py-8 text-center text-slate-500">
                                No hay leads registrados aún. Realiza una prueba en la calculadora.
                            </td>
                        </tr>`;
                    return;
                }

                tbody.innerHTML = data.map(lead => `
                    <tr class="hover:bg-slate-800/30 transition-colors">
                        <td class="px-6 py-4 font-mono text-xs text-slate-500">#${lead.id}</td>
                        <td class="px-6 py-4">
                            <div class="font-bold text-white">${lead.nombre}</div>
                            <div class="text-xs text-slate-400">${lead.empresa}</div>
                        </td>
                        <td class="px-6 py-4">
                            <div>${lead.email}</div>
                            <div class="text-xs text-slate-400">${lead.telefono}</div>
                        </td>
                        <td class="px-6 py-4 text-amber-400 font-medium">
                            $${Number(lead.factura_mensual).toLocaleString('es-CO')} COP
                        </td>
                        <td class="px-6 py-4">${lead.kw_estimados || 0} kWp</td>
                        <td class="px-6 py-4 text-emerald-400 font-bold">
                            $${Number(lead.ahorro_anual || 0).toLocaleString('es-CO')} COP
                        </td>
                        <td class="px-6 py-4 text-xs text-slate-500">
                            ${new Date(lead.fecha).toLocaleDateString('es-CO')}
                        </td>
                    </tr>
                `).join('');

            } catch (error) {
                console.error('Error al cargar leads:', error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="px-6 py-8 text-center text-red-400">
                            Error de conexión al obtener los datos.
                        </td>
                    </tr>`;
            }
        }

        window.onload = cargarLeads;
    </script>
</body>
</html>
