<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - Leads Solares</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Encabezado -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl gap-4">
            <div>
                <span class="bg-amber-500/10 text-amber-400 text-xs font-semibold px-3 py-1 rounded-full border border-amber-500/20">Panel v6.4.0 (Alertas Activas)</span>
                <h1 class="text-2xl font-bold text-white mt-1">Empresas Captadas (Ley 1715)</h1>
            </div>
            <div class="flex items-center gap-3">
                <button id="btn-permisos" onclick="solicitarPermisoNotificaciones()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition-colors">
                    🔔 Activar Alertas Sonoras
                </button>
                <button onclick="cargarLeads()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 px-4 py-2 rounded-xl text-sm font-bold transition-colors shadow-lg shadow-amber-500/10">
                    🔄 Actualizar Tabla
                </button>
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-sm transition-colors border border-slate-700">
                    Ir a la Calculadora
                </a>
            </div>
        </div>

        <!-- Tabla de Leads -->
        <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-800/50 text-slate-400 uppercase text-xs">
                        <tr>
                            <th class="px-6 py-4">ID</th>
                            <th class="px-6 py-4">Cliente / Empresa</th>
                            <th class="px-6 py-4">Contacto</th>
                            <th class="px-6 py-4">Factura Mensual</th>
                            <th class="px-6 py-4">kW Est.</th>
                            <th class="px-6 py-4">Ahorro Anual</th>
                            <th class="px-6 py-4">Fecha</th>
                            <th class="px-6 py-4 text-center">Acción Comercial</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-leads" class="divide-y divide-slate-800">
                        <tr>
                            <td colspan="8" class="px-6 py-8 text-center text-slate-500">Cargando registros...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let leadsCache = [];
        let ultimoMaxId = 0;
        let primeraCarga = true;

        // Función para sintetizar tono de alarma de audio
        function reproducirSonidoAlarma() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Tono A5
                osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.5);

                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {
                console.error("Error reproduciendo audio:", e);
            }
        }

        // Solicitar permisos de notificación de escritorio
        function solicitarPermisoNotificaciones() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        document.getElementById('btn-permisos').innerText = "✅ Alertas Activas";
                        document.getElementById('btn-permisos').classList.replace("bg-blue-600", "bg-emerald-600");
                        reproducirSonidoAlarma();
                    }
                });
            }
        }

        async function cargarLeads() {
            const tbody = document.getElementById('tabla-leads');
            try {
                const response = await fetch('/api/leads');
                const data = await response.json();

                if (!data || data.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="8" class="px-6 py-8 text-center text-slate-500">
                                No hay leads registrados aún. Realiza una prueba en la calculadora.
                            </td>
                        </tr>`;
                    return;
                }

                // Detectar si hay un nuevo lead para sonar alarma
                const maxIdActual = Math.max(...data.map(l => l.id));
                if (!primeraCarga && maxIdActual > ultimoMaxId) {
                    const nuevoLead = data.find(l => l.id === maxIdActual);
                    reproducirSonidoAlarma();
                    if ("Notification" in window && Notification.permission === "granted") {
                        new Notification("🚨 ¡NUEVO LEAD SOLAR CAPTADO!", {
                            body: `Cliente: ${nuevoLead.nombre}\nEmpresa: ${nuevoLead.empresa}\nFactura: $${Number(nuevoLead.factura_mensual).toLocaleString('es-CO')} COP`
                        });
                    }
                }

                ultimoMaxId = maxIdActual;
                primeraCarga = false;
                leadsCache = data;

                tbody.innerHTML = data.map(lead => `
                    <tr class="hover:bg-slate-800/30 transition-colors">
                        <td class="px-6 py-4 font-mono text-xs text-slate-500">#${lead.id}</td>
                        <td class="px-6 py-4">
                            <div class="font-bold text-white">${lead.nombre}</div>
                            <div class="text-xs text-slate-400">${lead.empresa}</div>
                        </td>
                        <td class="px-6 py-4">
                            <div>${lead.email}</div>
                            <div class="text-xs text-slate-400">${lead.telefono}</div>
                        </td>
                        <td class="px-6 py-4 text-amber-400 font-medium">
                            $${Number(lead.factura_mensual).toLocaleString('es-CO')} COP
                        </td>
                        <td class="px-6 py-4">${lead.kw_estimados || 0} kWp</td>
                        <td class="px-6 py-4 text-emerald-400 font-bold">
                            $${Number(lead.ahorro_anual || 0).toLocaleString('es-CO')} COP
                        </td>
                        <td class="px-6 py-4 text-xs text-slate-500">
                            ${new Date(lead.fecha).toLocaleDateString('es-CO')}
                        </td>
                        <td class="px-6 py-4 text-center">
                            <button onclick="generarPropuesta(${lead.id})" class="bg-emerald-500/10 hover:bg-emerald-500 text-emerald-400 hover:text-slate-950 border border-emerald-500/30 px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 mx-auto">
                                📄 Generar Propuesta
                            </button>
                        </td>
                    </tr>
                `).join('');

            } catch (error) {
                console.error('Error al cargar leads:', error);
            }
        }

        function generarPropuesta(id) {
            const lead = leadsCache.find(l => l.id === id);
            if (!lead) return alert('Lead no encontrado');

            const inversionEst = (lead.kw_estimados || 10) * 4500000;
            const deduccionRenta = inversionEst * 0.50;
            const ahorro20Anos = (lead.ahorro_anual || 0) * 20;

            const ventana = window.open('', '_blank');
            ventana.document.write(`
                <!DOCTYPE html>
                <html lang="es">
                <head>
                    <meta charset="UTF-8">
                    <title>Propuesta Comercial Solar - ${lead.empresa}</title>
                    <script src="https://cdn.tailwindcss.com"><\/script>
                </head>
                <body class="bg-white text-slate-900 font-sans p-10 max-w-4xl mx-auto space-y-8">
                    <div class="flex justify-between items-center border-b pb-6">
                        <div>
                            <h1 class="text-3xl font-extrabold text-amber-600">PROPUESTA DE ENERGÍA SOLAR</h1>
                            <p class="text-slate-500 text-sm">Modelo CAPEX Cero & Incentivos Ley 1715</p>
                        </div>
                        <div class="text-right text-xs text-slate-500">
                            <p>Fecha: ${new Date().toLocaleDateString('es-CO')}</p>
                            <p>Preparado por: Carlos Hoyos</p>
                        </div>
                    </div>

                    <div class="bg-slate-50 p-6 rounded-2xl border space-y-2">
                        <h2 class="text-lg font-bold text-slate-800">Información del Cliente</h2>
                        <div class="grid grid-cols-2 gap-4 text-sm">
                            <p><strong>Cliente:</strong> ${lead.nombre}</p>
                            <p><strong>Empresa:</strong> ${lead.empresa}</p>
                            <p><strong>Correo:</strong> ${lead.email}</p>
                            <p><strong>Teléfono:</strong> ${lead.telefono}</p>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h2 class="text-xl font-bold text-slate-800">Resumen Ejecutivo del Proyecto</h2>
                        <div class="grid grid-cols-3 gap-4 text-center">
                            <div class="p-4 bg-amber-50 rounded-xl border border-amber-200">
                                <span class="text-xs text-amber-700 font-semibold">Potencia Recomendada</span>
                                <p class="text-2xl font-bold text-amber-600 mt-1">${lead.kw_estimados || 0} kWp</p>
                            </div>
                            <div class="p-4 bg-emerald-50 rounded-xl border border-emerald-200">
                                <span class="text-xs text-emerald-700 font-semibold">Ahorro Primer Año</span>
                                <p class="text-xl font-bold text-emerald-600 mt-1">$${Number(lead.ahorro_anual || 0).toLocaleString('es-CO')} COP</p>
                            </div>
                            <div class="p-4 bg-blue-50 rounded-xl border border-blue-200">
                                <span class="text-xs text-blue-700 font-semibold">Ahorro Proyectado (20 Años)</span>
                                <p class="text-xl font-bold text-blue-600 mt-1">$${Number(ahorro20Anos).toLocaleString('es-CO')} COP</p>
                            </div>
                        </div>
                    </div>

                    <div class="border p-6 rounded-2xl space-y-3 bg-slate-900 text-white">
                        <h3 class="text-lg font-bold text-amber-400">Incentivos Tributarios Ley 1715 de Colombia</h3>
                        <ul class="text-sm space-y-2 text-slate-300 list-disc pl-5">
                            <li><strong>Deducción en Impuesto de Renta:</strong> Deducción del 50% de la inversión equivalente a $${Number(deduccionRenta).toLocaleString('es-CO')} COP.</li>
                            <li><strong>Exención de IVA:</strong> 0% IVA en la adquisición de paneles solares e inversores.</li>
                            <li><strong>Depreciación Acelerada:</strong> Hasta el 33.3% anual para reducir la carga tributaria corporativa.</li>
                        </ul>
                    </div>

                    <div class="pt-6 border-t text-center space-y-4 print:hidden">
                        <button onclick="window.print()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-6 py-3 rounded-xl transition-colors shadow-lg">
                            🖨️ Imprimir o Guardar en PDF
                        </button>
                    </div>
                </body>
                </html>
            `);
            ventana.document.close();
        }

        // Carga inicial y sondeo automatico cada 5 segundos
        window.onload = () => {
            cargarLeads();
            setInterval(cargarLeads, 5000);
        };
    </script>
</body>
</html>
